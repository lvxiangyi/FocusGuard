<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FocusGuard MVP interactive interface demo, v1.2.0">
  <title>FocusGuard · MVP 01</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#focus"><span class="brand-mark">f<span>g</span></span>FocusGuard<span class="brand-dot"></span></a>
      <div class="workspace-label" data-i18n="workspace"></div>
      <nav aria-label="Navigation">
        <button class="nav-item active" data-view="focus"><span class="nav-icon">◉</span><span data-i18n="focus"></span><span class="nav-arrow">↗</span></button>
        <button class="nav-item" data-view="recent"><span class="nav-icon">≡</span><span data-i18n="recent"></span></button>
        <button class="nav-item" data-view="cases"><span class="nav-icon">▧</span><span data-i18n="cases"></span><span id="caseCount" class="count">2</span></button>
        <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span><span data-i18n="settings"></span></button>
      </nav>
      <div class="sidebar-bottom"><div class="quiet-symbol">◎</div><p data-i18n="sidebarNote"></p><div class="version">MVP 01 <span>v1.2.0</span></div><small data-i18n="demoNote"></small></div>
    </aside>
    <div class="main-shell">
      <header class="topbar"><div class="breadcrumb">FocusGuard <span>/</span> <span id="crumb"></span></div><label class="locale-control"><span aria-hidden="true">◎</span><select id="uiLanguage" aria-label="Interface language"></select></label></header>
      <main>
        <section id="focusView" class="view">
          <div class="page-heading"><div><div class="eyebrow">YOUR FOCUS SPACE</div><h1 data-i18n="headline"></h1><p data-i18n="intro"></p></div><span class="pill neutral" data-i18n="sessionOnly"></span></div>
          <div class="focus-grid">
            <section class="focus-card">
              <div class="card-top"><span class="card-label" data-i18n="currentSession"></span><span id="sessionBadge" class="pill"></span></div>
              <label for="task" class="field-label" data-i18n="taskLabel"></label><input id="task" class="task-input" maxlength="120" required>
              <div class="timer-wrap"><svg class="timer-ring" viewBox="0 0 260 260" aria-hidden="true"><circle class="ring-track" cx="130" cy="130" r="112"/><circle id="ringProgress" class="ring-progress" cx="130" cy="130" r="112"/></svg><div class="timer-content"><span class="timer-caption" id="timerCaption"></span><div id="timer" role="timer">25:00</div><span class="timer-foot" id="timerFoot"></span></div></div>
              <div class="duration-picker" role="group" aria-label="Session duration"><button data-minutes="25" class="selected">25 <span data-i18n="min"></span></button><button data-minutes="45">45 <span data-i18n="min"></span></button><button data-minutes="60">60 <span data-i18n="min"></span></button></div>
              <button id="sessionAction" class="primary wide"></button><p class="micro-copy" data-i18n="screenNotice"></p>
            </section>
            <section class="status-card"><div class="card-top"><span class="card-label" data-i18n="liveStatus"></span><span class="live-dot"></span></div><div class="status-icon" id="statusIcon">✓</div><h2 id="statusTitle"></h2><p id="statusDescription" class="status-description"></p><div class="status-meta"><span data-i18n="nextCheck"></span><strong id="nextCheck">—</strong></div><div class="status-meta"><span data-i18n="reference"></span><strong id="referenceCount">—</strong></div><div class="status-tip"><span>✧</span><p data-i18n="referenceHint"></p></div></section>
          </div>

          <div class="demo-toolbar"><span class="demo-label">DEMO</span><span data-i18n="tryStates"></span><button id="previewBlock" class="text-button" data-i18n="previewBlock"></button><button id="previewError" class="text-button" data-i18n="previewError"></button></div>
        </section>
        <section id="recentView" class="view" hidden><div class="page-heading"><div><h1 data-i18n="recent"></h1><p data-i18n="sampleRecords"></p></div></div><div id="records"></div></section>
        <section id="casesView" class="view" hidden><div class="page-heading"><div><div class="eyebrow">PERSONAL CONTEXT</div><h1 data-i18n="cases"></h1><p data-i18n="casesIntro"></p></div><span class="pill neutral" id="caseTotal"></span></div><div class="case-info"><span>✧</span><p data-i18n="caseInfo"></p></div><div id="caseList" class="case-grid"></div></section>
        <section id="settingsView" class="view" hidden><div class="page-heading"><div><div class="eyebrow">MAKE IT YOURS</div><h1 data-i18n="settings"></h1><p data-i18n="settingsIntro"></p></div></div><div class="settings-card"><h2 data-i18n="languages"></h2><div class="setting-row"><div><label for="settingsUi" data-i18n="uiLanguage"></label><p data-i18n="uiHint"></p></div><select id="settingsUi"></select></div><div class="setting-row"><div><label for="answerLanguage" data-i18n="answerLanguage"></label><p data-i18n="answerHint"></p></div><select id="answerLanguage"></select></div><div class="language-preview"><span class="eyebrow" data-i18n="questionPreview"></span><p id="questionPreview"></p></div><details><summary data-i18n="advanced"></summary><div class="setting-row"><label for="interval" data-i18n="interval"></label><select id="interval"><option value="60">1 min</option><option value="180">3 min</option><option value="300" selected>5 min</option></select></div><div class="setting-row"><label for="threshold" data-i18n="threshold"></label><select id="threshold"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select></div></details><p class="subtle" data-i18n="autoSaved"></p></div></section>
      </main>
      <footer><span>FocusGuard</span><span data-i18n="footer"></span><span>mvp-demo-v1.2.0</span></footer>
    </div>
  </div>
  <dialog id="blockDialog" class="block-dialog" aria-labelledby="blockTitle"><div class="block-inner"><div class="block-top"><span class="brand">FocusGuard<span class="brand-dot"></span></span><button class="close-demo" data-close="blockDialog" data-i18n="exitPreview"></button></div><div class="block-layout"><div class="block-message"><div class="eyebrow">A MOMENT TO REFOCUS</div><div class="pause-icon">Ⅱ</div><h1 id="blockTitle" data-i18n="blockTitle"></h1><p data-i18n="blockIntro"></p><div class="block-context"><span data-i18n="yourTask"></span><strong id="blockedTask"></strong><span data-i18n="noticed"></span><p data-i18n="offReason"></p></div><button id="blockCorrection" class="light-link" data-i18n="actuallyWorking"></button></div><div class="quiz-card"><div class="card-top"><span class="card-label" data-i18n="smallQuestion"></span><span class="pill neutral">01 / 01</span></div><label for="quizLanguage" class="field-label" data-i18n="answerLanguage"></label><select id="quizLanguage"></select><h2 id="quizQuestion"></h2><label for="translationInput" class="field-label" data-i18n="yourTranslation"></label><textarea id="translationInput" rows="3" maxlength="1000"></textarea><div id="translationReview" class="language-preview" hidden><span data-i18n="referenceTranslation"></span><p id="referenceTranslation"></p></div><p id="quizFeedback" role="status"></p><button id="quizSubmit" class="primary wide" data-i18n="checkAnswer"></button><button id="giveUp" class="text-button wide" data-i18n="giveUp"></button><button id="nextQuestion" class="primary wide" hidden data-i18n="nextQuestion"></button><button id="returnToWork" class="primary wide" hidden data-i18n="returnToWork"></button><p class="subtle" data-i18n="quizNote"></p></div></div></div></dialog>
  <dialog id="correctionDialog" class="correction-dialog" aria-labelledby="correctionTitle"><form id="correctionForm"><div class="card-top"><span class="eyebrow">PERSONAL CONTEXT</span><button type="button" class="icon-button" data-close="correctionDialog" aria-label="Close">×</button></div><h2 id="correctionTitle" data-i18n="correctTitle"></h2><p data-i18n="correctIntro"></p><div class="screen-preview"><div class="screen-bar"><i></i><i></i><i></i><span data-i18n="illustration"></span></div><div class="screen-body"><span>▶</span><div><strong data-i18n="videoTitle"></strong><p data-i18n="videoDescription"></p></div></div></div><div class="judgment-line"><span data-i18n="aiJudgment"></span><span id="originalJudgment" class="pill warning"></span></div><fieldset><legend data-i18n="actualLabel"></legend><label class="radio-choice"><input type="radio" name="verdict" value="on" checked><span data-i18n="onTask"></span></label><label class="radio-choice"><input type="radio" name="verdict" value="off"><span data-i18n="offTask"></span></label></fieldset><label for="correctionReason" class="field-label" data-i18n="reasonLabel"></label><textarea id="correctionReason" rows="3" maxlength="500" required></textarea><p class="subtle" data-i18n="saveHint"></p><button type="submit" class="primary wide" data-i18n="saveCase"></button></form></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="app.js"></script>
</body>
</html>
